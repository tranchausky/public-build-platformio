<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ESP32 Local Installer</title>
  <link rel="stylesheet" href="/style.css" />
  <script type="module" src="https://unpkg.com/esp-web-tools@10.1.1/dist/web/install-button.js?module"></script>
</head>
<body>
  <main class="container">
    <header>
      <div>
        <h1>ESP32 Local Installer</h1>
        <p>PlatformIO build scanner + ESP Web Tools</p>
      </div>
      <button id="refreshBtn" class="secondary">Refresh builds</button>
    </header>

    <section class="panel">
      <h2>Project folder</h2>
      <div class="row">
        <input id="folderInput" type="text" placeholder="D:\\Projects\\ESP32\\MyProject" />
        <button id="addProjectBtn">Add / Open</button>
      </div>
      <p class="hint">Paste the local PlatformIO project path. The server will scan .pio/build.</p>

      <div id="savedProjects" class="saved-projects"></div>
    </section>

    <section class="panel">
      <div class="section-title">
        <div>
          <h2>Builds</h2>
          <div id="currentProject" class="current-project">No project selected</div>
        </div>
      </div>

      <div id="message"></div>
      <div id="buildList" class="build-list"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
